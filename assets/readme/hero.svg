<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">踏雪创意风格</title>
  <desc id="desc">影像风格引擎：你说想画什么，它写成模型能听懂的指令。成图用完整原图展示。</desc>

  <rect width="1200" height="280" rx="18" fill="#F4EEE4"/>
  <rect x="0" y="32" width="4" height="216" fill="#C3272B"/>

  <g transform="translate(56 36)">
    <text x="0" y="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8B8174" letter-spacing="6">影像风格引擎</text>
    <text x="0" y="68" font-family="Songti SC, STSong, Songti TC, Georgia, serif" font-size="44" fill="#2C2C2C">踏雪创意风格</text>
    <text x="0" y="104" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="17" fill="#3A3530">你说想画什么，它写成模型能听懂的指令</text>

    <g transform="translate(0 132)">
      <rect width="108" height="28" rx="4" fill="#FAF6EE" stroke="#D4CBB8"/>
      <text x="54" y="19" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#2C2C2C">9 家族</text>
      <rect x="120" width="108" height="28" rx="4" fill="#FAF6EE" stroke="#D4CBB8"/>
      <text x="174" y="19" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#2C2C2C">47 变体</text>
      <rect x="240" width="108" height="28" rx="4" fill="#FAF6EE" stroke="#D4CBB8"/>
      <text x="294" y="19" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#C3272B">4 能力</text>
    </g>

    <g transform="translate(0 190)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
      <text x="0" y="0" fill="#2C2C2C">意图</text>
      <text x="42" y="0" fill="#C4B8A8">→</text>
      <text x="64" y="0" fill="#2C2C2C">家族</text>
      <text x="106" y="0" fill="#C4B8A8">→</text>
      <text x="128" y="0" fill="#2C2C2C">指令</text>
      <text x="170" y="0" fill="#C4B8A8">→</text>
      <text x="192" y="0" fill="#C3272B">成图</text>
    </g>
  </g>

  <rect x="1108" y="196" width="32" height="32" rx="2" fill="#C3272B"/>
  <text x="1124" y="218" text-anchor="middle" font-family="Kaiti SC, STKaiti, Songti SC, serif" font-size="15" fill="#F4EEE4">雪</text>
</svg>
