<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">从意图到成图</title>
  <desc id="desc">识别意图，选定家族，编译七维指令，出图后对照禁忌自检。</desc>
  <rect width="1200" height="280" rx="22" fill="#F4EEE4"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
    <g transform="translate(40 48)">
      <rect width="250" height="184" fill="#FAF6EE" stroke="#D4CBB8"/>
      <rect width="4" height="184" fill="#2C2C2C"/>
      <text x="24" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8B8174">01</text>
      <text x="24" y="84" font-family="Songti SC, STSong, Georgia, serif" font-size="28" fill="#2C2C2C">意图</text>
      <text x="24" y="124" font-size="15" fill="#5C564E">出图、优化、从零写，</text>
      <text x="24" y="148" font-size="15" fill="#5C564E">或记住以后怎么用。</text>
    </g>
    <g transform="translate(330 48)">
      <rect width="250" height="184" fill="#FAF6EE" stroke="#D4CBB8"/>
      <rect width="4" height="184" fill="#2C2C2C"/>
      <text x="24" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8B8174">02</text>
      <text x="24" y="84" font-family="Songti SC, STSong, Georgia, serif" font-size="28" fill="#2C2C2C">编译</text>
      <text x="24" y="124" font-size="15" fill="#5C564E">先定家族，再定变体。</text>
      <text x="24" y="148" font-size="15" fill="#5C564E">调性先于笔触。</text>
    </g>
    <g transform="translate(620 48)">
      <rect width="250" height="184" fill="#FAF6EE" stroke="#D4CBB8"/>
      <rect width="4" height="184" fill="#2C2C2C"/>
      <text x="24" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8B8174">03</text>
      <text x="24" y="84" font-family="Songti SC, STSong, Georgia, serif" font-size="28" fill="#2C2C2C">指令</text>
      <text x="24" y="124" font-size="15" fill="#5C564E">七维补全，锁色板、</text>
      <text x="24" y="148" font-size="15" fill="#5C564E">留白、构图与禁忌。</text>
    </g>
    <g transform="translate(910 48)">
      <rect width="250" height="184" fill="#FAF6EE" stroke="#D4CBB8"/>
      <rect width="4" height="184" fill="#C3272B"/>
      <text x="24" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8B8174">04</text>
      <text x="24" y="84" font-family="Songti SC, STSong, Georgia, serif" font-size="28" fill="#2C2C2C">成图</text>
      <text x="24" y="124" font-size="15" fill="#5C564E">对照家族禁忌自检，</text>
      <text x="24" y="148" font-size="15" fill="#5C564E">过关才交付。</text>
    </g>
  </g>
</svg>
